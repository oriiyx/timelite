name: Tests

# Every job calls the same runner and profile definitions as local runs
# (tools/test.py, tools/inventory.json). Reports and logs are uploaded even
# when a job fails. Native Windows runtime coverage is a separate job from
# the MinGW cross-build, which only compiles.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local:
    name: local profiles (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Doctor
        run: python3 tools/test.py doctor
      - name: Run native, sanitize and runner profiles
        run: python3 tools/test.py run local --jobs 2 --timeout 300
      - name: Ordinary Make build and fast native check
        run: make check
      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-runs-local-${{ matrix.os }}
          path: build/test-runs
          if-no-files-found: warn

  containers:
    name: container profiles (linux, linux32, windows-cross)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned toolchain image
        run: python3 tools/test.py prepare
      - name: Linux x86-64
        run: python3 tools/test.py run linux --jobs 2 --timeout 300
      - name: Linux x86 32-bit
        if: ${{ !cancelled() }}
        run: python3 tools/test.py run linux32 --jobs 2 --timeout 300
      - name: Windows x86-64 MinGW cross-build
        if: ${{ !cancelled() }}
        run: python3 tools/test.py run windows-cross --jobs 2 --timeout 300
      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-runs-containers
          path: build/test-runs
          if-no-files-found: warn

  windows:
    name: windows-native (Windows Server 2022 x64, Clang + SDK)
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Doctor
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture
          python tools/test.py doctor
      - name: Run windows-native profile
        shell: pwsh
        run: python tools/test.py run windows-native --jobs 2 --timeout 300
      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-runs-windows
          path: build/test-runs
          if-no-files-found: warn

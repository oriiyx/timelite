name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix:
    name: C99 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and run example and file I/O tests
        run: make check

  linux_32:
    name: C99 (Linux x86 32-bit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install 32-bit compiler support
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: Build and test with 64-bit file offsets
        run: make CC="gcc -m32" check

  windows:
    name: C99 (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run example
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          clang -std=c99 -Wall -Wextra -Wpedantic -Werror -I. timelite.c examples/basic.c -o build/basic.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/basic.exe
          exit $LASTEXITCODE
